name: Test
on:
  push:
    branches:
      - '*'
      - '!main'
     
jobs:
  Trigger-Github-Scan:
    runs-on: ubuntu-20.04
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."

      - name: Checkout THIS repository
        uses: actions/checkout@v2
     
      - name: Checkout OTHER repository
        uses: actions/checkout@v2
        with:
          repository: NHSDigital/software-engineering-quality-framework
          path: tmp
          ref: refs/heads/main

      - name: List files
        run: |
          ls -la tmp/tools/nhsd-git-secrets
          pwd


      - name: Preparing folder and file permissions
        run: |
          cp -r tmp/tools/nhsd-git-secrets ${{ github.workspace }}
          ls -al ${{ github.workspace }}
          sed -i 's/cd ..//' ${{ github.workspace }}/nhsd-git-secrets/scan-repo-linux-mac.sh
          cat ${{ github.workspace }}/nhsd-git-secrets/scan-repo-linux-mac.sh
          chmod 700 ./nhsd-git-secrets/scan-repo-linux-mac.sh
          chmod 700 ./nhsd-git-secrets/git-secrets
          cp ./nhsd-git-secrets/git-secrets ${{ github.workspace }}
          ls -al ${{ github.workspace }}
         
      - name: Run Secret scan
        run: |
          ls -al
          ls -al nhsd-git-secrets
          ./nhsd-git-secrets/scan-repo-linux-mac.sh

  